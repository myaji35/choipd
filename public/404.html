<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>페이지를 찾을 수 없어요</title>
  <style>
    body {
      margin: 0;
      padding: 0 20px;
      background: #f2f0eb;
      color: rgba(0, 0, 0, 0.87);
      font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      line-height: 1.6;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }
    main { max-width: 480px; margin: 64px auto; }
    h1 { font-size: 2rem; line-height: 1.25; }
    a {
      display: inline-flex;
      align-items: center;
      min-height: 48px;
      margin-top: 8px;
      padding: 0 20px;
      background: #00754A;
      color: #fff;
      border-radius: 6px;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>찾으시는 페이지가 없어요</h1>
    <p>주소가 바뀌었거나, 페이지를 만든 분이 내렸을 수 있어요.</p>
    <p>받으신 링크나 QR 을 보내 준 분께 새 주소를 물어봐 주세요.</p>
    <a href="/">처음 화면으로</a>
  </main>
</body>
</html>
